DAY 1 - DOCKER BASICS ON UBUNTU VM
Purpose: Make FastAPI run inside Docker so it works anywhere.

Commands and Purpose:

  sudo apt update
  Purpose: Refresh software list from Ubuntu servers.

  sudo apt upgrade -y
  Purpose: Upgrade all packages to latest. -y means auto yes.

  sudo apt install -y ca-certificates curl gnupg
  Purpose: ca-certificates for https, curl for download, gnupg for verification.

  sudo install -m 0755 -d /etc/apt/keyrings
  Purpose: Create folder for Docker key.

  curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  Purpose: Download Docker GPG key to prove package is original.

  sudo chmod a+r /etc/apt/keyrings/docker.gpg
  Purpose: Give read permission to key.

  echo "deb [arch=...] https://download.docker.com/linux/ubuntu ..." | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
  Purpose: Add Docker repo to Ubuntu sources.

  sudo apt update
  Purpose: Refresh again including Docker repo.

  sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  Purpose: Install Docker Engine, CLI, Runtime, Build and Compose plugins.

  sudo usermod -aG docker $USER
  Purpose: Add user to docker group to run without sudo.

  newgrp docker
  Purpose: Apply group change immediately.

  docker --version
  Purpose: Check Docker installed.

  docker ps
  Purpose: List running containers.

  cd ~/rag_project
  Purpose: Go to project folder.

  ls -la
  Purpose: Verify main.py, ingest.py, query.py exist.

  pip freeze > requirements.txt
  Purpose: Save list of libraries for Docker.

  cat requirements.txt
  Purpose: Show requirements.

  nano Dockerfile
  Purpose: Create Dockerfile - recipe for image.

  Dockerfile Content Explained:
    FROM python:3.10-slim - Base Python image
    WORKDIR /app - Work folder inside container
    COPY requirements.txt . - Copy requirements
    RUN pip install --no-cache-dir -r requirements.txt - Install libs
    COPY . . - Copy all project files
    EXPOSE 8000 - Open FastAPI port
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"] - Start server

  docker build -t rag-fastapi:v1 .
  Purpose: Build image named rag-fastapi v1.

  docker images
  Purpose: Verify image created.

  docker run -d -p 8000:8000 --name rag_api rag-fastapi:v1
  Purpose: -d background, -p port map, --name container name.

  docker logs rag_api
  Purpose: Check logs for errors.

  docker ps
  Purpose: Verify container running.

  Browser: http://localhost:8000/docs
  Purpose: Swagger UI test. If opens, Day 1 DONE.

DAY 2 - DOCKER COMPOSE FULL STACK
Purpose: Run all 7 services in one command.

  cd ~/rag_project
  Purpose: Go to project folder.

  mkdir -p chroma_data postgres_data
  Purpose: Create folders to save data permanently.

  nano docker-compose.yml
  Purpose: Create compose file defining all services.

  Services in Compose:
    fastapi (8000) - Main API, env POSTGRES_HOST, CHROMA_HOST, OLLAMA_HOST
    postgres (5432) - User raguser, pass ragpass, db ragdb
    chroma (8001) - Vector DB, volume ./chroma_data
    ollama (11434) - LLM server, volume ollama_data
    prometheus (9090) - Metrics collector
    node-exporter (9100) - CPU/Memory metrics
    grafana (3000) - Dashboard, admin/admin123

  nano prometheus.yml
  Purpose: Config for Prometheus.
    global scrape_interval 15s - Collect every 15 sec
    job prometheus localhost:9090 - Monitor Prometheus
    job node-exporter node-exporter:9100 - Monitor system
    job fastapi fastapi:8000 - Monitor API

  docker compose up -d ollama
  Purpose: Start Ollama only first.

  docker exec -it rag_ollama ollama pull qwen2.5:7b
  Purpose: Download Qwen model inside container.

  docker exec -it rag_ollama ollama list
  Purpose: Confirm model downloaded.

  docker compose down
  Purpose: Stop old containers to avoid port conflict.

  docker compose up -d
  Purpose: Start all 7 services.

  docker ps
  Purpose: Verify 7 containers running.

  Test URLs:
    Swagger http://localhost:8000/docs - Purpose: Test query
    Postgres: docker exec -it rag_postgres psql -U raguser -d ragdb -c "\\dt" - Purpose: List tables
    Chroma: curl http://localhost:8001/api/v1/heartbeat - Purpose: Check alive
    Ollama: curl http://localhost:11434/api/tags - Purpose: List models
    Prometheus http://localhost:9090 - Purpose: Metrics
    Grafana http://localhost:3000 admin/admin123 - Purpose: Dashboard

licas, port."}]},{day:"Day 14",title:"Cloud Deployment",goal:"Make the RAG live on the internet, not only on your local VM.",items:[{c:"ssh -i key.pem ubuntu@<EC2-IP>",p:"Connects to your AWS EC2 Ubuntu server over SSH."},{c:"git clone <your-repo>",p:"Gets your code onto the cloud server."},{c:"docker compose up -d",p:"Starts the whole stack on the cloud server."},{c:"Open http://<EC2-IP>:8000/docs from your phone",p:"Verifies the live deployment. If it opens on your phone, it is truly deployed."}]},{day:"Day 15",title:"Text-to-SQL Demo",goal:"Chat with a database in plain English.",items:[{c:"nano text2sql.py",p:"Creates the Text-to-SQL script.",file:"text2sql.py",fp:"User asks “Show top 5 students with high CGPA” → Qwen converts it to SELECT * FROM students ORDER BY cgpa DESC LIMIT 5 → run on Postgres/MySQL → Qwen explains the result in English."},{c:"python text2sql.py",p:"Tests Text-to-SQL."}]},{day:"Day 16",title:"LLM Evaluation",goal:"Prove your RAG is correct with a measured score.",items:[{c:"nano eval.csv  (20 questions)",p:"Creates the test set.",file:"eval.csv",fp:"Columns: Question, Expected Answer, Actual Answer, Correct (Yes/No)."},{c:"python evaluate.py",p:"Runs all 20 questions through the RAG and calculates accuracy %. Output: Accuracy = Correct / Total × 100."}]},{day:"Day 17",title:"Guardrails + Alerting",goal:"Make the LLM safe and reliable in production.",items:[{c:`if len(answer) < 10: return "I don't know, please check documents"`,p:"Guardrail in main.py: if the answer is too short, don't hallucinate — say you don't know."},{c:"Grafana Alert: latency > 3s for 5 minutes → alert",p:"Notifies you when the LLM is slow, so you can act before users complain."},{c:"docker logs rag_prometheus",p:"Checks Prometheus metrics to debug the alert."}]},{day:"Day 18",title:"Agentic AI Demo",goal:"Build an agent that takes action, not just answers.",items:[{c:"pip install langgraph",p:"Installs LangGraph for building agents."},{c:"nano agent.py",p:"Creates the agent script.",file:"agent.py",fp:"Agent receives the query → decides to call the FastAPI tool to check the DB → gets the result and answers."},{c:"python agent.py",p:"Tests the agent."}]}]},{name:"Phase 4 — Job Ready",range:"Day 19 → 20",days:[{day:"Day 19",title:"Resume + LinkedIn",goal:"Present as Senior DevOps + AI, not as a fresher.",items:[{c:"LinkedIn headline: Senior DevOps | MLOps | GenAI Platform Engineer — RAG, LLM, FastAPI, Grafana",p:"Your headline is the first line a recruiter reads. It should name the role and the exact tools."},{c:"Resume bullets: RAG platform (Ollama + Qwen + ChromaDB + FastAPI + Postgres, monitored with Prometheus/Grafana, Dockerised) • College Admission System (FastAPI + MySQL + Ollama) • CNN Classifier (FastAPI + Grafana)",p:"Each bullet ties a project to its stack and to production monitoring — the proof employers look for."},{c:"Skills: DevOps, Docker, Kubernetes, FastAPI, RAG, Ollama, Qwen, ChromaDB, Postgres, MySQL, Prometheus, Grafana, LangChain, CNN, NLP, Pandas, NumPy",p:"Add these exact keywords so recruiters and ATS systems can find you."}]},{day:"Day 20",title:"Mock Interview + Apply",goal:"Practise loudly, then apply to 10 jobs.",items:[{c:"Practice: 1) Explain RAG architecture  2) How Ollama + Qwen works  3) How Grafana monitoring works  4) Scale to 1000 users  5) Why DevOps + AI is your strength",p:"These five answers cover architecture, local LLM, monitoring, scaling and your unique selling point."},{c:"Search LinkedIn / Naukri: MLOps, GenAI Platform, AIOps, Senior DevOps AI",p:"Finds jobs paying 18–25 LPA. Goal: apply to 10 jobs on Day 20."}]}]}],l0=[{name:"Project 2 — Build in Order",range:"Day 1 → 20",days:[{day:"Day 1",title:"Install the Stack",goal:"Install every library this project needs — one command, then the LLM.",items:[{c:"pip install flask streamlit langchain faiss-cpu pymupdf mlflow",p:"Flask = API, Streamlit = UI, LangChain = LLM chain, FAISS = vector search, PyMuPDF = PDF reading, MLflow = experimen nd."},{c:"nano app.py",p:"Creates the Flask app.",file:"app.py",fp:"Flask endpoint POST /analyze: receives resume text + JD, calls analyze.py, saves the result to MongoDB, returns the score."},{c:`mongo ragdb --eval 'db.results.insertOne({score: 78, missing: ["Docker"]})'`,p:"Tests a MongoDB insert. Proves you can store and later read results — for example, to show history in the UI."},{c:"flask --app app run --port 5000",p:"Runs the Flask API on port 5000."}]},{day:"Day 6",title:"ui.py — Streamlit UI",goal:"Let a candidate upload a resume and see the result in the browser.",items:[{c:"nano ui.py",p:"Creates the Streamlit UI.",file:"ui.py",fp:"File uploader for the PDF, text area for the Job Description, a button to call /analyze, and display for score, missing skills and questions."},{c:"streamlit run ui.py",p:"Starts the Streamlit app. Opens in the browser — usually at http://localhost:8501."}]},{day:"Day 7",title:"MLflow Tracking",goal:"Track every analysis as an experiment.",items:[{c:"mlflow ui",p:"Starts the MLflow UI — usually at http://localhost:5000 (or 5001 if Flask is using 5000). Open it to see runs, scores and parameters.",file:"mlflow",fp:"MLflow logs each run: resume, score, model (llama3.2:3b) and missing skills. You can compare runs over time, which is exactly what an ML team expects."},{c:"mlflow run .  # or log inside analyze.py",p:"Logs a run from the analysis code so it appears in MLflow."}]},{day:"Day 8",title:"Report PDF Generation",goal:"Turn the result into a downloadable PDF report.",items:[{c:"pip install reportlab fpdf2",p:"Installs libraries that create PDFs from Python."},{c:"nano report.py",p:"Creates the report generator.",file:"report.py",fp:"Takes score, missing skills and interview questions and writes them into a PDF the candidate can download and share."},{c:"python report.py",p:"Generates a sample report PDF and checks it opens correctly."}]},{day:"Day 9",title:"Dockerise Project 2",goal:"Make Project 2 run with one command, lik brary for forecasting, segmentation and optimisation — one command, then the data.",items:[{c:"pip install pandas numpy scikit-learn prophet matplotlib",p:"Pandas + NumPy clean and analyse data, scikit-learn trains segmentation, Prophet forecasts sales, Matplotlib charts the trend."},{c:"pip install fastapi uvicorn psycopg2-binary sqlalchemy",p:"FastAPI + Uvicorn serve the /forecast API, SQLAlchemy and psycopg2 connect it to PostgreSQL."},{c:`python -c "import pandas, prophet; print('Stack ready')"`,p:"Verifies Pandas and Prophet import cleanly before you build on them."}]},{day:"Day 2",title:"Create data.csv + EDA with Pandas",goal:"Build the FMCG sales file and understand it before any model sees it.",items:[{c:"mkdir ~/fmcg_project && cd ~/fmcg_project",p:"Creates the FMCG project folder and enters it."},{c:"nano data.csv",p:"Creates the sales file.",file:"data.csv",fp:"Columns: Date, City, Product, Sales, Price, Distribution, Promotion. Example row: 2024-01-01,Pune,Coke,1240,20,85,1 — one day, one city, one product."},{c:'python — EDA: import pandas as pd  •  df = pd.read_csv("data.csv")  •  df.head()  •  df.describe()  •  df.groupby(["City","Product"])["Sales"].sum()',p:"Pandas loads the CSV, head() shows the first rows, describe() shows statistics, groupby() shows which city and product sell the most."},{c:'python — df.plot(x="Date", y="Sales")  # check seasonality, promotions and dips',p:"Plots sales over time so you can see festivals, promotions and weekly patterns before forecasting."}]},{day:"Day 3",title:"Feature Engineering",goal:"Turn raw sales rows into signals a forecasting model can learn from.",items:[{c:"nano features.py",p:"Creates the feature script.",file:"features.py",fp:"Date features: day, month, weekday and is_weekend. Lag features: sales 7 and 30 days ago. Rolling mean: average sales over the last 7 days. Promotion and Price stay as inputs."},{c:"python features.py",p:"Runs the feature builder and saves the enriched dataset."},{c:"df['lag_7 CH]- (c:Customer)",p:"Links the customer to a Branch, so risk can be read by branch as well as by person.",file:"neo4j / graph.cypher",fp:"Nodes: Customer, Account, Loan, Branch, Risk. Relations: HAS_LOAN, HAS_ACCOUNT, DEFAULTED. Cypher = Neo4j's query language — CREATE makes nodes, MATCH finds them."}]},{day:"Day 3",title:"graph_ingest.py — Load Bank Data",goal:"Turn bank documents and customer data into the Neo4j graph, so the agent has real facts to check.",items:[{c:"nano graph_ingest.py",p:"Creates the ingestion script.",file:"graph_ingest.py",fp:"Logic: read bank documents + customer CSV → clean customer, account and loan rows → open the Neo4j driver → CREATE nodes and HAS_LOAN / HAS_ACCOUNT / DEFAULTED relationships → log counts. Without this, the graph stays empty."},{c:"python graph_ingest.py",p:"Runs the ingestion and prints how many customers, loans and accounts were loaded."},{c:"MATCH (n) RETURN labels(n) AS type, count(n) AS total",p:"Verifies the graph in Neo4j Browser: counts each node type, so you can prove the load worked."}]},{day:"Day 4",title:"LangChain + LlamaIndex — Graph + Docs Retrieval",goal:"Search the graph and the documents together, not one or the other.",items:[{c:"nano retrieval.py",p:"Creates the retrieval script.",file:"retrieval.py",fp:"Logic: LangChain builds the prompt and chain → LlamaIndex indexes bank policy documents → FAISS stores document chunks → retrieval combines a graph query (Neo4j facts) + document chunks (policy text) into one context."},{c:"python retrieval.py",p:"Tests retrieval: ask a loan question and check the answer cites both a graph fact and a policy document."}]},{day:"Day 5",title:"Agentic AI — agent.py with LangGraph",goal:"Build an agent that decides a loan check itself: graph first, then RAG, then a decision.",items:[{c:"pip install langgraph",p:"Installs LangGraph for building agents with a decision flow."},{c:"nano agent.py",p:"Creates the agent script.",file:"agent.py",fp:"Agent receives the request → decides: 1) Check Graph (Neo4j: loans, defaults, accounts) → 2) Check RAG (LlamaIndex + FAISS: policy docs) → 3) Give decision (eligible / risk / reason). LangGraph holds that order, so the agent cannot skip the graph check."},{c:"python agent.py",p:"Tests the agent end-to-end and prints the decision, risk score and reason from the Knowledge Graph."}]},{day:"Day 6",title:"FastAPI — /loan-check Endpoint",goal:"Expose the agent as an API a bank system or UI can call.",items:[{c:"nano app.py",p:"Creates the FastAPI app.",file:"app.py — POST /loan-check",fp:"Endpoint /loan-check: receives customer_id + loan request → calls agent.py → returns Eligibility, Risk Score, Reason and Compliance Check as JSON."},{c:"uvicorn app:app --port 8004 --host 0.0.0.0",p:"Runs the Project 4 API on port 8004."},{c:`curl -X POST http://localhost:8004/loan-check -H "Content-Type: application/json" -d '{"customer_id": "C1001", "amount": 500000}'`,p:"Tests the endpoint for a real customer and checks the JSON decision comes back."}]},{day:"Day 7",title:"Postgres + MLflow — Store & Track Decisions",goal:"Save every decision for audit and track every agent run, so compliance can be proven.",items:[{c:"CREATE TABLE decisions (id SERIAL PRIMARY KEY, customer_id TEXT, eligible BOOLEAN, risk_score FLOAT, reason TEXT, compliance_check TEXT, created_at TIMESTAMP DEFAULT NOW());",p:"Creates the table that stores each decision, its risk score, its reason and its compliance check — the audit trail for Responsible AI.",file:"decisions table",fp:"id = row number. customer_id = who was checked. eligible / risk_score / reason = the agent output. compliance_check = the Responsible AI check. created_at = when it was saved."},{c:"mlflow ui",p:"Starts the MLflow UI so you can see agent runs, prompts and scores — the tracking for this project."}]},{day:"Day 8",title:"Dockerise Project 4",goal:"Make the whole stack — Neo4j + FastAPI + Postgres — run with one command.",items:[{c:"nano Dockerfile",p:"Creates the Dockerfile.",file:"Dockerfile",fp:"FROM python:3.10-slim → WORKDIR /app → COPY requirements.txt → RUN pip install → COPY . . → EXPOSE 8004 → CMD runs uvicorn app:app on 8004."},{c:"nano docker-compose.yml",p:"Creates the Compose file.",file:"docker-compose.yml",fp:"Services: neo4j (7474 / 7687) — knowledge graph, fastapi (8004) — /loan-check API, postgres (5432) — decisions table. Same production pattern as Projects 1–3, new graph stack."},{c:"docker compose up -d",p:"Starts the full Project 4 stack in the background."},{c:"docker ps",p:"Verifies all three containers are running."}]},{day:"Day 9",title:"Fine-tuning Concept — Small Demo",goal:"Show you understand fine-tuning: adapt a small model to bank language, with a measured demo.",items:[{c:"nano finetune_demo.py",p:"Creates a small fine-tune demo script.",file:"finetune_demo.py",fp:"Concept: load a small model → fine-tune on a small labelled set of bank Q&A (loan, risk, compliance terms) → compare the base model vs the tuned model on the same questions → save the tuned adapter. Purpose: prove adaptation, not just prompting — the MLOps/LLMOps skill the Architect role asks for."},{c:"python finetune_demo.py",p:"Runs the small demo and prints the before / after answers, so you can show the tuning effect."}]},{day:"Day 10",title:"Grafana Dashboard + Responsible AI Check",goal:"Monitor decisions and prove the system is fair and compliant, not just fast.",items:[{c:"Open http://localhost:3000",p:"Opens Grafana — admin / admin123 on a fresh Docker install."},{c:"Dashboard → Add Panel → Decisions by Risk + Compliance",p:"Builds the hero panel.",file:"Panels to create",fp:"Eligibility rate = approved vs rejected. Avg Risk Score = risk trend. Compliance checks = Responsible AI pass rate. Reason coverage = how many decisions carry a graph reason. The Responsible AI check flags a decision if it has no reason or a missing compliance check."},{c:`curl -X POST http://localhost:8004/loan-check -d '{"customer_id": "C1001", "amoun inikube-linux-amd64 /usr/local/bin/minikube",p:"Installs Minikube so you can start and manage the cluster from the terminal."},{c:"minikube start",p:"Starts the local Kubernetes cluster — Dev, Staging and Prod are modelled on this same pattern."},{c:"kubectl get nodes",p:"Confirms the node is Ready before you install anything on top of it.",file:"kubectl",fp:"kubectl = the CLI that talks to Kubernetes — get nodes checks the cluster is up."},{c:"curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash",p:"Installs Helm, the package manager for Kubernetes charts."},{c:"helm version",p:"Verifies Helm is installed, so Day 2–7 installs via Helm will work."}]},{day:"Day 2",title:"Install ArgoCD + Jenkins",goal:"Set up GitOps and CI so a code push can build, test and deploy — and roll back — without manual steps.",items:[{c:"kubectl create namespace argocd",p:"Creates a separate namespace for ArgoCD, so platform tooling stays isolated from app workloads."},{c:"kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml",p:"Installs ArgoCD — it watches Git and syncs the cluster to the desired state. This is the GitOps control plane.",file:"argo",fp:"kubectl apply -f argo = installs ArgoCD manifests. Git becomes the source of truth for what runs in the cluster."},{c:"kubectl get pods -n argocd",p:"Verifies ArgoCD pods are Running before you trust it with a sync."},{c:"helm repo add jenkins https://charts.jenkins.io",p:"Adds the Jenkins chart repo, so Helm can install Jenkins for CI."},{c:"helm install jenkins jenkins/jenkins -n jenkins --create-namespace",p:"Installs Jenkins — it builds and tests code from GitHub Actions / Jenkins jobs and hands the artefact to GitOps."},{c:"kubectl port-forward svc/jenkins -n jenkins 8080:8080",p:"Opens Jenkins in the browser to configure the pipeline, users and the first build job."}]},{day:"Day 3",title:"Terraform for AWS EKS",goal:"Define the production cluster as code, so Dev / Staging / Prod are repeatable — not hand-built.",items:[{c:"mkdir ~/aiops_project && cd ~/aiops_project",p:"Creates the Project 5 folder and enters it, so Terraform, Helm values and dashboards live together."},{c:"nano main.tf",p:"Creates the Terraform file.",file:"main.tf",fp:"Defines AWS EKS cluster, node groups, VPC and IAM — the same cluster shape for Dev / Staging / Prod, only the size changes."},{c:"terraform init",p:"Downloads the AWS and EKS providers Terraform needs before it can plan anything."},{c:"terraform plan",p:"Shows exactly what Terraform will create — review this before you apply, to avoid surprise cost or wrong regions."},{c:"terraform apply",p:"Creates the EKS cluster on AWS. This is the production-grade target ArgoCD will deploy to."},{c:"aws eks update-kubeconfig --name aiops-cluster --region ap-south-1",p:"Connects kubectl to the new EKS cluster, so the same kubectl / Helm commands now target cloud."}]},{day:"Day 4",title:"Deploy Sample Microservices with Helm",goal:"Prove the platform works: deploy real services, not an empty cluster.",items:[{c:"nano values.yaml",p:"Creates the Helm values file.",file:"values.yaml",fp:"Holds image, replicas, resources and HPA settings — one values file per environment keeps Dev / Staging / Prod consistent."},{c:"helm install api ./charts/api -f values.yaml",p:"Installs the first sample microservice with Helm — image, service and deployment created from the chart."},{c:"helm install frontend ./charts/frontend -f values.yaml",p:"Installs the second service, so you can test service-to-service traffic and a dashboard that shows more than one app."},{c:"kubectl get pods -A",p:"Verifies all microservices are Running across namespaces."},{c:"kubectl get svc",p:"Checks the services expose the pods correctly — the URL a user or Grafana panel will call."}]},{day:"Day 5",title:"Install Prometheus + Grafana + Loki + Tempo via Helm",goal:"Wire observability into the cluster: metrics, dashboards, logs and traces from one install pattern.",items:[{c:"helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",p:"Adds the Prometheus + Grafana chart repo."},{c:"helm repo add grafana https://grafana.github.io/helm-charts",p:"Adds the Grafana repo for Loki (logs) and Tempo (traces)."},{c:"helm repo update",p:"Refreshes both repos so the install fetches the latest charts."},{c:"helm install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace",p:"Installs Prometheus for metrics and Grafana for dashboards in one stack — the observability core."},{c:"helm install loki grafana/loki-stack -n monitoring",p:"Installs Loki, so pod logs are searchable in Grafana next to metrics."},{c:"helm install tempo grafana/tempo -n monitoring",p:"Installs Tempo, so a slow request can be traced across services — the third leg of observability."},{c:"kubectl get pods -n monitoring",p:"Verifies the whole observability stack is Running before you build panels."}]},{day:"Day 6",title:"Add AI RAG Log Analyzer — Connect Project 1 RAG to Logs",goal:"Turn logs into answers: reuse the Project 1 RAG so the platform explains failures, not just graphs them.",items:[{c:"kubectl logs -l app=api -n default --tail=200",p:"Reads recent API pod logs — the raw input the AI layer will analyse."},{c:"nano log_analyzer.py",p:"Creates the analyser.",file:"log_analyzer.py",fp:"Logic: fetch logs from Loki / kubectl → send the relevant chunk to Project 1 RAG (FastAPI on 8000, Chroma + Ollama + Qwen) → ask for root cause + fix → return a short AI incident report."},{c:`curl -X POST http://localhost:8000/query -H "Content-Type: application/json" -d '{"question": "Why did the api pod crash?"}'`,p:"Tests the RAG endpoint on a log question — the same pattern the dashboard will use live."},{c:"kubectl get events --sort-by=.lastTimestamp",p:"Checks cluster events for context the log alone may miss — restarts, OOM kills and pull failures."}]},{day:"Day 7",title:"Add Kubecost + Trivy + Vault",goal:"Add the three platform guardrails: cost, security scanning and secrets — in that order.",items:[{c:"helm repo add kubecost https://kubecost.github.io/cost-analyzer/",p:"Adds the Kubecost repo for cost-per-service visibility."},{c:"helm install kubecost kubecost/cost-analyzer -n kubecost --create-namespace",p:"Installs Kubecost — cost per service, per team and per namespace, so savings are visible, not guessed."},{c:"trivy image api:latest",p:"Scans the API image for CVEs before it is deployed. Trivy blocks a vulnerable image from reaching Prod."},{c:"helm install vault hashicorp/vault -n vault --create-namespace",p:"Installs Vault — secrets are stored and injected at runtime, never hardcoded in Git."},{c:"kubectl exec -it vault-0 -n vault -- vault kv put secret/api DB_PASS='change-me'",p:"Stores a sample secret in Vault — the pattern every service will follow instead of env files."}]},{day:"Day 8",title:"Build One Dashboard UI — FastAPI + Grafana",goal:"Join every layer into one pane of glass: health, cost, deployment status and AI suggestions.",items:[{c:"nano dashboard_api.py",p:"Creates the dashboard API.",file:"dashboard_api.py — GET /platform",fp:"Endpoint /platform: aggregates health (Prometheus), cost (Kubecost), deployment status (ArgoCD) and the AI incident report (Project 1 RAG) into one JSON the UI reads."},{c:"uvicorn dashboard_api:app --port 8005 --host 0.0.0.0",p:"Runs the dashboard API on port 8005 — the single backend for the One Dashboard UI."},{c:"Open http://localhost:3000",p:"Opens Grafana — the visual half of the dashboard. The FastAPI UI and Grafana panels together are the one pane of glass."},{c:"Grafana → Create Dashboard → Add Panels → Health / Cost / Deployment / AI Suggestions",p:"Builds the hero panels: Health = pod status, Cost = Kubecost, Deployment = ArgoCD sync, AI Suggestions = RAG root-cause text."}]},{day:"Day 9",title:"Dockerize + GitOps Pipeline — ArgoCD Sync",goal:"Make the pipeline repeatable: Docker build → Git push → ArgoCD sync → cluster updated, with rollback ready.",items:[{c:"nano Dockerfile",p:"Creates the Dockerfile for the dashboard API.",file:"Dockerfile",fp:"FROM python:3.10-slim → WORKDIR /app → COPY requirements.txt → RUN pip install → COPY . . → EXPOSE 8005 → CMD runs uvicorn dashboard_api:app on 8005."},{c:"docker build -t aiops-dashboard:v1 .",p:"Builds the dashboard image that GitOps will deploy."},{c:'git add . && git commit -m "AIOps dashboard v1 — GitOps" && git push',p:"Pushes the new image tag and Helm values to Git — the commit itself is the deployment request."},{c:"kubectl apply -f argocd-app.yaml",p:"Tells ArgoCD to watch this Git repo and sync it into the cluster.",file:"argocd-app.yaml",fp:"ArgoCD Application: repo + path + destination cluster. When Git changes, ArgoCD notices and syncs."},{c:"argocd app sync aiops-dashboard",p:"Forces the sync now — ArgoCD applies the new Helm chart and restarts pods with the new image."},{c:"argocd app get aiops-dashboard",p:"Verifies the app is Synced and Healthy — the GitOps proof the platform is live."}]},{day:"Day 10",title:"Test Failure — Kill Pod, See AI Report + Auto Rollback",goal:"Prove self-healing: break it on purpose, watch the AI report arrive and the platform recover.",items:[{c:"kubectl delete pod -l app=api",p:"Kills an API pod on purpose — the failure test. Kubernetes should recreate it, and the AI layer should explain it."},{c:"kubectl get pods -w",p:"Watches pods recreate — the self-healing proof, in real time."},{c:"kubectl logs -l app=api --tail=100",p:"Reads the new pod's logs to confirm what the AI report should say about the restart."},{c:"curl http://localhost:8005/platform",p:"Calls the dashboard API — it should return health, the AI incident report in seconds, and the new deployment status."},{c:"argocd app rollback aiops-dashboard",p:"Rolls back to the last healthy version if the new image fails — Auto Rollback, the safety net for every deploy.",file:"Auto Rollback",fp: eaming + search layer in one place.",file:"docker-compose.yml",fp:"Services: kafka (9092) — log stream, elasticsearch (9200) — searchable log store. Wazuh and Suricata write to Kafka; the detector reads from Kafka and writes alerts to Elasticsearch."},{c:"docker compose up -d",p:"Starts Kafka and Elasticsearch together in the background."},{c:"docker ps",p:"Verifies both containers are running."},{c:"curl http://localhost:9200",p:"Checks Elasticsearch is alive — it should answer with cluster info JSON."},{c:"docker exec -it soc_kafka kafka-topics.sh --create --topic security-logs --bootstrap-server localhost:9092",p:"Creates the security-logs topic — the named channel every log flows through before detection."}]},{day:"Day 3",title:"Train XGBoost for Attack Detection",goal:"Train a classifier that turns log features into an attack probability, so brute force is caught by pattern — not by a static rule alone.",items:[{c:"pip install xgboost scikit-learn pandas",p:"Installs XGBoost for the classifier, scikit-learn for metrics and Pandas for the labelled log dataset."},{c:"nano train.py",p:"Creates the training script.",file:"train.py",fp:"Logic: load labelled logs → build features (login failures in 5 min, distinct ports, payload size, failed / success ratio) → split train / test → train XGBoost → evaluate precision / recall → save model.pkl. The same features are built live in Day 8."},{c:"python train.py",p:"Trains XGBoost and saves model.pkl — the model the detector calls for every new log window."},{c:`python -c "import xgboost; print('Attack probability example: 0.97')"`,p:"Quick sanity check that the trained model outputs a probability — e.g. 97% for a known brute-force window."}]},{day:"Day 4",title:"Ollama Llama for Log Explanation",goal:"Make the model explain itself — not just a score, a readable reason an analyst can act on.",items:[{c:"ollama pull llama3.2:3b",p:"Downloads Llama 3.2 (3B) — the local model that will read logs and explain them. Smaller and fast enough for this SOC."},{c:"ollama run llama3.2:3b",p:"Starts Llama in the terminal so you can test its explanation style on one log line before you wire it into the pipeline."},{c:"nano explain.py",p:"Creates the explanation helper.",file:"explain.py",fp:"Logic: take XGBoost probability + log window + Neo4j context → prompt Llama via Ollama → return a 1–2 line reason, e.g. “Brute Force from IP 45.22.11.5”. This is the text the dashboard and the Slack alert show."},{c:"python explain.py",p:"Tests the explanation end-to-end and prints the reason for a sample brute-force window."}]},{day:"Day 5",title:"LangGraph Agent",goal:"Build an agent that decides the response itself: check the graph, then block or alert — in that order, every time.",items:[{c:"pip install langgraph",p:"Installs LangGraph for building agents with a decision flow."},{c:"nano agent.py",p:"Creates the agent script.",file:"agent.py",fp:"Agent receives the alert → decides: 1) Check Neo4j Knowledge Graph for the IP → 2) If bad → Block IP → 3) If unknown → Alert + Ticket. LangGraph holds that order, so the agent cannot block without checking the graph first."},{c:"python agent.py",p:"Tests the agent end-to-end and prints the decision, the graph reason and the action taken."}]},{day:"Day 6",title:"Neo4j Knowledge Graph for Bad IPs",goal:"Store what is known about every IP, attack and host, so a repeat offender is blocked instantly.",items:[{c:"docker run -d --name neo4j -p 7474:7474 -p 7687:7687 -e NEO4J_AUTH=neo4j/password123 neo4j:latest",p:"Starts Neo4j in Docker. 7474 = browser UI, 7687 = Bolt driver port."},{c:"CREATE (ip:IP {address: '45.22.11.5', status: 'bad'})-[:ATTACKED]->(h:Host {name: 'web-01'})",p:"Creates an IP node, a Host node and the ATTACKED relationship — the core pattern every agent check will follow. A bad IP is one already seen in a confirmed attack."},{c:"MATCH (ip:IP)-[:ATTACKED]->(h:Host) WHERE ip.address = '45.22.11.5' RETURN ip, h",p:"Tests the graph: finds the bad IP and what it attacked. This is the graph check the agent runs first.",file:"neo4j / graph.cypher",fp:"Nodes: IP, Host, Attack, User. Relations: ATTACKED, SCANNED, LOGGED_IN. Cypher = Neo4j's query language — CREATE makes nodes, MATCH finds them."},{c:"docker ps",p:"Verifies Neo4j is running before the agent queries it."}]},{day:"Day 7",title:"Auto Block Script",goal:"Turn a confirmed bad IP into a firewall block automatically — no manual SSH step in the middle of an attack.",items:[{c:"nano block_ip.py",p:"Creates the auto-block helper.",file:"block_ip.py",fp:"Logic: receive the bad IP from agent.py → run the iptables block → log the block to MongoDB and Elasticsearch → send the Slack / Email alert with the reason. Blocking and logging happen together, so every block is auditable."},{c:"sudo iptables -A INPUT -s 45.22.11.5 -j DROP",p:"Blocks the example bad IP at the firewall — INPUT chain, source IP, DROP the packet. Replace 45.22.11.5 with the IP the agent confirmed, never a guessed address."},{c:"sudo iptables -L INPUT -n -v",p:"Lists INPUT rules and proves the block is actually in the firewall, with packet counts."},{c:"python block_ip.py --ip 45.22.11.5",p:"Tests the script end-to-end: block, log and alert for the confirmed bad IP."}]},{day:"Day 8",title:"FastAPI + MongoDB Store",goal:"Expose the SOC as an API and store every alert, block and decision for audit.",items:[{c:"pip install fastapi uvicorn pymongo",p:"Installs FastAPI and Uvicorn for the API, and PyMongo to talk to MongoDB."},{c:"nano app.py",p:"Creates the FastAPI app.",file:"app.py — POST /alert",fp:"Endpoint /alert: receives the detection → calls the agent → saves alert, decision and block to MongoDB → returns Attack, Decision, Reason and Action as JSON."},{c:"docker run -d --name mongo -p 27017:27017 mongo:latest",p:"Starts MongoDB in Docker — the document store for alerts, blocks and tickets."},{c:"uvicorn app:app --port 8006 --host 0.0.0.0",p:"Runs the SOC API on port 8006 — the single backend the dashboard reads."},{c:`curl -X POST http://localhost:8006/alert -H "Content-Type: application/json" -d '{"ip": "45.22.11.5", "attack": "Brute Force"}'`,p:"Tests the alert endpoint for the example brute-force IP and checks the JSON decision comes back."}]},{day:"Day 9",title:"Grafana Dashboard + Wazuh Dashboard",goal:"Show the SOC on one dashboard: attacks today, blocked, pending and the AI report — live, not from a screenshot.",items:[{c:"Open http://localhost:3000",p:"Opens Grafana — admin / admin123 on a fresh Docker install."},{c:"Grafana → Add Data Source → ClickHouse / MongoDB / Elasticsearch",p:"Connects Grafana to the stored alerts, so panels read live data instead of a static export."},{c:"Dashboard → Add Panel → Attacks Today / Blocked / Pending",p:"Builds the hero panels.",file:"Panels to create",fp:"Attacks Today = 45. Blocked = 42. Pending = 3. AI Report = the Llama explanation for the latest attack. The Wazuh Dashboard shows the same events from the SIEM side, so both views agree."},{c:"Open Wazuh Dashboard — check the same attack appears there",p:"Verifies Grafana and Wazuh agree on the same alert — if they disagree, the pipeline, not the dashboard, is the bug."}]},{day:"Day 10",title:"Test Attack Simulation with Nmap",goal:"Prove the whole SOC works end-to-end by scanning your own VM — and watching detection, explanation and block fire.",items:[{c:"sudo apt install -y nmap",p:"Installs Nmap — the port scanner used only against your own localhost VM for this test."},{c:"nmap -sV localhost",p:"Scans your own VM and lists open ports and services (-sV). Suricata should see the port scan, XGBoost should score it and the agent should decide."},{c:"curl http://localhost:8006/alert  # then check Grafana + Wazuh",p:"Verifies the simulated attack flows from log → detection → agent → dashboard, with a reason and an action."},{c:"sudo iptables -L INPUT -n -v  # confirm the test IP is handled, then remove the test block",p:"Confirms the block rule exists after the test, then removes the test rule so your own VM is not left blocked."}]}]}];function y0(){return m("div",{className:"space-y-5",children:[m("div",{className:"rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4 sm:p-6",children:[m("div",{className:"flex items-center gap-2 text-xs tracking-[0.16em] uppercase text-[var(--muted)] font-bold",children:[a(fe,{size:14})," Main flow — attack to response"]}),m("div",{className:"mt-5 space-y-3",children:[a(ue,{nodes:[{t:"Attacker",s:"Login failure, Malware, Phishing, Port Scan",p:"Threat",icon:a(Tr,{size:18})},{t:"Log Collection",s:"Wazuh / Falco / Suricata → Kafka → Elasticsearch",p:"Logs",icon:a(ye,{size:18})},{t:"AI Detection",s:"XGBoost + Ollama Llama 3.2 explains “Brute Force from IP 45.22.11.5”",p:"Detect",icon:a(Qe,{size:18})}]}),a("div",{className:"flex justify-center text-[var(--accent)]",children:a(we,{size:18})}),a(ue,{nodes:[{t:"Agentic AI",s:"LangGraph Agent checks Neo4j Knowledge Graph — if bad → Block IP, if unknown → Alert + Ticket",p:"Agent",icon:a(ge,{size:18})},{t:"Response",s:"Auto Block via iptables / WAF, Slack / Email Alert",p:"Block",icon:a(Ce,{size:18})},{t:"Storage + Monitoring",s:"MongoDB + ClickHouse + Grafana + Wazuh Dashboard + MLflow",p:"Store",icon:a(Q,{size:18})}]}),a("div",{className:"flex justify-center text-[var(--accent)]",children:a(we,{size:18})}),a(ue,{nodes:[{t:"Output Dashboard",s:"Attacks Today 45, Blocked 42, Pending 3, AI Report",p:"Output",icon:a(Ze,{size:18})}]})]})]}),m("div",{className:"grid md:grid-cols-3 gap-4",children:[a(B,{title:"Input",icon:a(oe,{size:16}),body:["Security logs","Network traffic"]}),a(B,{title:"Output",icon:a(Q,{size:16}),body:["Attack detection","Auto Block","AI Report","Dashboard"]}),a(B,{title:"Advantage",icon:a(ge,{size:16}),body:["Rare combo DevOps + AI + Cyber","IIT Jammu curriculum","SOC Lead / AI Security Architect roles","45-60 LPA"]})]}),m("div",{className:"rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-5",children:[a ,{n:7,name:"Airflow",role:"Pipeline",purpose:"Scheduled batch pipelines — nightly training data, feature backfills and model retraining jobs."},{n:8,name:"Spark",role:"Big Data",purpose:"Large historical jobs — aggregates years of transactions for training and feature analysis."},{n:9,name:"Qdrant",role:"Vector DB",purpose:"Vector search over transaction embeddings — finds similar fraud patterns from past cases."},{n:10,name:"Mistral 7B via vLLM",role:"LLM",purpose:"Explains the decision in plain English — fraud probability plus a readable reason for the analyst."},{n:11,name:"BGE Embeddings",role:"Embeddings",purpose:"Turns transaction + user history into vectors so Qdrant can compare new payments with known fraud."},{n:12,name:"LangGraph",role:"Orchestration",purpose:"Controls the agent flow — XGBoost score → Qdrant check → Mistral explanation → blockchain record, in order."},{n:13,name:"ClickHouse",role:"DB",purpose:"Columnar store for fast analytics — queries millions of transactions for the dashboard."},{n:14,name:"Redis",role:"Cache",purpose:"In-memory cache for features and user history — avoids slow DB reads on the 200ms path."},{n:15,name:"Elasticsearch",role:"Search",purpose:"Full-text search over transactions, reasons and decisions — finds any case in seconds."},{n:16,name:"Feast",role:"Feature Store",purpose:"One source of truth for features — the same feature values in training and live scoring."},{n:17,name:"XGBoost",role:"ML Model",purpose:"Core fraud classifier — learns from labelled transactions and outputs the fraud probability."},{n:18,name:"Weights & Biases",role:"Tracking",purpose:"Tracks XGBoost experiments — metrics, parameters and model versions in one place."},{n:19,name:"BentoML",role:"Serving",purpose:"Serves the model behind a clean API — versioned, container-ready and easy to scale."},{n:20,name:"Datadog",role:"Monitoring",purpose:"Live metrics, latency alerts and dashboards — knows the 200ms budget is breaking before users do."},{n:21,name:"OpenTelemetry + Jaeger",role:"Tracing",purpose:"Distributed traces from UI to Kafka to Flink to model — shows exactly where a slow payment stalls."},{n:22,name:"Nomad",role:"Orchestration",purpose:"Runs jobs and services without Kubernetes complexity — schedules Flink, API and workers."},{n:23,name:"Pulumi",role:"IaC",purpose:"Infrastructure as code in real code — defines cloud, queues and databases so the stack is repeatable."},{n:24,name:"Consul",role:"Secrets",purpose:"Service discovery and secrets — services find each other and read keys without hardcoding them."},{n:25,name:"GitLab CI",role:"CI/CD",purpose:"Build, test and deploy on every commit — pipeline for Go, Next.js and Python services."},{n:26,name:"Locust",role:"Load Test",purpose:"Load test with real user behaviour — proves the API still answers in 200ms at 1000s of payments."},{n:27,name:"Hyperledger Fabric",role:"Blockchain",purpose:"Permissioned blockchain for an immutable decision record — the fraud decision cannot be edited later."},{n:28,name:"Falco + OPA",role:"Security",purpose:"Falco watches runtime threats, OPA enforces policy — only valid, allowed decisions reach the ledger."},{n:29,name:"Fly.io / Render",role:"Deployment",purpose:"Simple cloud deploy for the live demo — Go API, Next.js UI and workers up in minutes."}],hf=[{name:"Project 6 — Build in Order",range:"Day 1 → 10",days:[{day:"Day 1",title:"Install Go + Gin",goal:"Set up the fast language and backend the 200ms fraud API will run on.",items:[{c:"sudo apt update && sudo apt install -y golang-go",p:"Installs Go on Ubuntu — the language for the low-latency fraud API."},{c:"go version",p:"Confirms Go is installed and shows its version before you write any code."},{c:"mkdir ~/fraud_project && cd ~/fraud_project && go mod init fraud",p:"Creates the project folder and a Go module so Gin and other packages can be added.",file:"go.mod",fp:"go.mod = the Go project manifest. It records the module name and the versions of Gin, Kafka and Redis clients you add."},{c:"go get github.com/gin-gonic/gin",p:"Downloads Gin — the web framework for the Go fraud API."},{c:"nano main.go",p:"Creates the Go entry point.",file:"main.go — Gin API",fp:"Gin server: GET /health, POST /fraud-check. Receives a transaction, returns FRAUD / NOT FRAUD + probability + reason."},{c:"go run main.go",p:"Runs the Gin API locally. Check it answers on port 8080 before Kafka is wired in."}]},{day:"Day 2",title:"Install Kafka + Flink Stream",goal:"Make payments flow as events and process them live, not by polling a database.",items:[{c:"docker run -d --name kafka -p 9092:9092 apache/kafka:latest",p:"Starts Kafka in Docker — the durable queue every payment event will pass through."},{c:"docker exec kafka /opt/kafka/bin/kafka-topics.sh --create --topic payments --bootstrap-server localhost:9092",p:"Creates the payments topic — the named channel Flink will read from."},{c:"docker run -d --name flink -p 8081:8081 flink:latest",p:"Starts Flink — the stream processor that joins live payments with history and calls the model."},{c:"Open http://localhost:8081",p:"Opens the Flink dashboard so you can see the running stream job.",file:"Flink job",fp:"Flink job: read payments from Kafka → enrich with Feast/Redis → score → write decision to Kafka + ClickHouse."},{c:"kafka-console-producer --topic payments --bootstrap-server localhost:9092",p:"Test producer: type one payment JSON and watch Flink process it end-to-end."}]},{day:"Day 3",title:"Install Qdrant + Redis + Elasticsearch",goal:"Add vector search for similar fraud, a cache for the fast path, and search for analysts.",items:[{c:"docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:latest",p:"Starts Qdrant in Docker — the vector DB for similar fraud patterns."},{c:"curl http://localhost:6333/collections",p:"Checks Qdrant is alive and lists collections — it should answer with JSON."},{c:"docker run -d --name redis -p 6379:6379 redis:latest",p:"Starts Redis — the in-memory cache for features and user history on the 200ms path."},{c:"docker run -d --name elasticsearch -p 9200:9200 -e discovery.type=single-node elasticsearch:8.13.0",p:"Starts Elasticsearch — full-text search for transactions, reasons and decisions.",file:"docker-compose.yml",fp:"Services: qdrant (6333) — vector search, redis (6379) — cache, elasticsearch (9200) — search. One file, one command to restart the data layer."},{c:"docker compose up -d",p:"Starts the full data layer together after you add the services to docker-compose.yml."}]},{day:"Day 4",title:"Install vLLM + Mistral 7B Explanation",goal:"Make the model explain itself — not just a score, a readable reason.",items:[{c:"pip install vllm",p:"Installs vLLM — the fast serving engine for Mistral 7B, so explanations arrive in milliseconds."},{c:"python -m vllm.entrypoints.openai.api_server --model mistralai/Mistral-7B-Instruct-v0.3 --port 8000",p:"Serves Mistral via an OpenAI-compatible API. The fraud service calls this for the reason text."},{c:`curl http://localhost:8000/v1/completions -H "Content-Type: application/json" -d '{"prompt": "Explain why this payment is suspicious: amount 49999, new device, night time"}'`,p:"Tests Mistral — it should return a short fraud explanation, not just a number."},{c:"nano explain.py",p:"Creates the explanation helper.",file:"explain.py",fp:"Logic: take XGBoost probability + Qdrant similar cases → prompt Mistral via vLLM → return 1–2 line reason. This is the text analysts and the dashboard show."}]},{day:"Day 5",title:"Install Feast + ClickHouse",goal:"Give training and live scoring the exact same features, and a fast store for analytics.",items:[{c:"pip install feast",p:"Installs Feast — the feature store for consistent features."},{c:"feast init fraud_features && cd fraud_features",p:"Scaffolds a Feast repo so you can define features in code."},{c:"nano features.py",p:"Defines the feature view.",file:"features.py",fp:"Features: amount, velocity_1h, device_age, country_mismatch, history_fraud_rate. Defined once, served to training and live scoring identically."},{c:"feast apply && feast materialize",p:"Registers the features and loads them into the online store (Redis) for live lookups."},{c:"docker run -d --name clickhouse -p 8123:8123 -p 9000:9000 clickhouse/clickhouse-server:latest",p:"Starts ClickHouse — the columnar DB that powers fast dashboard analytics."}]},{day:"Day 6",title:"Train XGBoost",goal:"Train the core fraud classifier and track it, so the score is measured — not a guess.",items:[{c:"pip install xgboost scikit-learn pandas wandb",p:"Installs XGBoost for the classifier, scikit-learn for metrics, Pandas for data and Weights & Biases for tracking."},{c:"nano train_xgboost.py",p:"Creates the training script.",file:"train_xgboost.py",fp:"Logic: load transactions + Feast features → split train/test → train XGBoost → evaluate precision / recall → log to W&B → save model.pkl. BGE embeddings are computed here for Qdrant."},{c:"wandb login",p:"Connects W&B so every run — parameters, accuracy and latency — is stored and comparable."},{c:"python train_xgboost.py",p:"Trains XGBoost and saves model.pkl — the model BentoML will serve."},{c:`python -c "import xgboost; print('Fraud probability example: 0.92')"`,p:"Quick sanity check that the trained model outputs a probability — e.g. 92% for a known fraud case."}]},{day:"Day 7",title:"Build Go Gin API + Next.js UI + Kong",goal:"Join everything into one API and one dashboard behind a gateway.",items:[{c:"nano fraud_handler.go",p:"Creates the fraud handler.",file:"fraud_handler.go — POST /fraud-check",fp:"Handler: read transaction → Kafka publish → Feast/Redis features → XGBoost via BentoML → Qdrant similar patterns → Mistral explanation → return 200ms FRAUD / NOT FRAUD."},{c:"go run .",p:"Runs the full Go API — it now talks to Kafka, Redis, Qdrant and the model, not just a stub."},{c:"npx create-next-app@latest fraud-dashboard --typescript",p:"Creates the Next.js dashboard that shows the decision, reason and blockchain proof."},{c:"npm run dev",p:"Starts Next.js on port 3000 — the UI the analyst sees when a payment is scored."},{c:"docker run -d --name kong -p 8001:8001 kong:latest",p:"Starts Kong — the API gateway in front of Go, Next.js and the model APIs."},{c:`curl http://localhost:8001/fraud-check -X POST -H "Content-Type: application/json" -d '{"amount": 49999, "user_id": "U1001"}'`,p:"Tests the gateway route — Kong forwards to Gin, Gin returns the decision. If it returns in ~200ms, Day 7 is DONE."}]},{day:"Day 8",title:"LangGraph + BentoML + Hyperledger Fabric",goal:"Orchestrate the decision flow, serve the model cleanly, and record the decision immutably.",items:[{c:"pip install langgraph bentoml",p:"Installs LangGraph for orchestration and BentoML for model serving."},{c:"nano agent.py",p:"Creates the LangGraph agent.",file:"agent.py",fp:"Graph: Score (XGBoost) → Similar (Qdrant) → Explain (Mistral) → Record (Hyperledger). LangGraph holds that order, so a decision never skips the ledger step."},{c:"nano service.py",p:"Creates the BentoML service.",file:"service.py — BentoML",fp:"BentoML service wraps model.pkl: POST /predict returns probability. XGBoost is versioned and served separately from Gin."},{c:"bentoml serve service:svc",p:"Serves XGBoost via BentoML — the endpoint Go calls for the score."},{c:"docker compose up -d hyperledger",p:"Starts the Hyperledger Fabric network — the permissioned blockchain that stores the decision hash."},{c:`curl -X POST http://localhost:8004/record -d '{"decision": "FRAUD", "probability": 0.92}'`,p:"Records the decision on Fabric — the proof is immutable and can be checked later by an auditor."}]},{day:"Day 9",title:"Test with Locust + Observability & Security",goal:"Prove 200ms at load, trace every payment, and lock the platform down.",items:[{c:"pip install locust",p:"Installs Locust — the load test tool that simulates many paying users at once."},{c:"nano locustfile.py",p:"Creates the load test.",file:"locustfile.py",fp:"Locust: POST /fraud-check with realistic payments. Checks p95 latency stays under 200ms and no errors appear at 1000 users."},{c:"locust -f locustfile.py --host http://localhost:8001",p:"Runs Locust and opens its dashboard — the proof the API holds its speed under load."},{c:"OpenTelemetry: export OTEL traces → Jaeger http://localhost:16686",p:"Opens Jaeger to see a full trace — UI → Kong → Gin → Kafka → Flink → model → blockchain — in one view.",file:"Datadog / OpenTelemetry",fp:"Datadog = metrics + alerts for latency and errors. OpenTelemetry + Jaeger = traces that show exactly where a slow payment stalls."},{c:"falco --dry-run && opa test policy/",p:"Checks Falco runtime rules and OPA policy tests pass before deployment — Falco watches threats, OPA blocks invalid decisions."}]},{day:"Day 10",title:"Deploy + Pipelines — Nomad, Pulumi, Consul, GitLab CI, Fly.io/Render",goal:"Ship it with repeatable infrastructure, secrets and a CI pipeline.",items:[{c:"nano main.tf  # or pulumi.yaml — define infra as code",p:"Defines infrastructure with Pulumi — Kafka, Redis, Qdrant and the API as code, not hand-built.",file:"Pulumi / Nomad",fp:"Pulumi = infra as code in code. Nomad = runs jobs/services (Flink, API, workers) on the cluster without Kubernetes."},{c:'consul kv put fraud/api-key "change-me"',p:"Stores the API key in Consul — secrets are read at runtime, never hardcoded in Git."},{c:"nano .gitlab-ci.yml",p:"Creates the GitLab CI pipeline.",file:".gitlab-ci.yml",fp:"Stages: build Go + Next.js → test XGBoost + Locust → build image → deploy. Every push runs the same checks."},{c:"flyctl deploy  # or render deploy",p:"Deploys the live demo to Fly.io or Render — Go API, Next.js UI and workers up for anyone to try."},{c:"airflow dags trigger retrain && spark-submit retrain_job.py",p:"Triggers the nightly Airflow retrain and Spark batch job — the stack keeps learning from new fraud patterns."},{c:`curl https://<your-app>.fly.dev/fraud-check -X POST -d '{"amount": 49999}'`,p:"Verifies the live deployment returns FRAUD / NOT FRAUD in ~200ms from the internet. If it does, Project 6 is DONE."}]}]}];function g0(){return m("div",{className:"space-y-5",children:[m("div",{className:"rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4 sm:p-6",children:[m("div",{className:"flex items-center gap-2 text-xs tracking-[0.16em] uppercase text-[var(--muted)] font-bold",children:[a(fe,{size:14})," Main flow — payment to decision in 200ms"]}),m("div",{className:"mt-5 space-y-3",children:[a(ue,{nodes:[{t:"User Makes Payment",s:"Payment starts the flow",p:"Input",icon:a(oe,{size:18})},{t:"Next.js UI → Kong API Gateway",s:"UI calls the gateway",p:"3000 / 8001",icon:a(Ze,{size:18})},{t:"Kafka → Flink Stream",s:"Event queue → live stream",p:"9092",icon:a(ye,{size:18})},{t:"Feast Feature Store + Redis Cache",s:"Same features, fast lookup",p:"Features",icon:a(ye,{size:18})}]}),a("div",{className:"flex justify-center text-[var(--accent)]",children:a(we,{size:18})}),a(ue,{nodes:[{t:"XGBoost + Mistral LLM via vLLM",s:"Fraud Probability 92% + Explanation",p:"92%",icon:a(Qe,{size:18})},{t:"Qdrant Vector Search",s:"Similar Fraud Patterns",p:"Vector",icon:a(ut,{size:18})},{t:"Hyperledger Fabric Blockchain",s:"Decision Immutable",p:"Ledger",icon:a(ge,{size:18})},{t:"ClickHouse + Elasticsearch",s:"Store + Search",p:"Store",icon:a(ye,{size:18})}]}),a("div",{className:"flex justify-center text-[var(--accent)]",children:a(we,{size:18})}),a(ue,{nodes:[{t:"BentoML Serve + Datadog Monitor",s:"Serve + monitor the model",p:"Serve",icon:a(Q,{size:18})},{t:"OpenTelemetry Trace",s:"Full trace of the payment",p:"Trace",icon:a(ut,{size:18})},{t:"Go + Gin API Returns in 200ms",s:"FRAUD / NOT FRAUD",p:"200ms",icon:a(Ce,{size:18})}]})]})]}),m("div",{className:"grid md:grid-cols-3 gap-4",children:[a(B,{title:"Input",icon:a(oe,{size:16}),body:["Transaction data","User history"]}),a(B,{title:"Output",icon:a(Q,{size:16}),body:["Fraud / Not Fraud in 200ms","Reason","Blockc
