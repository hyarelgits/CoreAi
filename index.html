.text-\[var\(--text\)\]{
  color: var(--text);
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-emerald-400{
  --tw-text-opacity: 1;
  color: rgb(52 211 153 / var(--tw-text-opacity, 1));
}

.text-white\/50{
  color: rgb(255 255 255 / 0.5);
}

.text-white\/60{
  color: rgb(255 255 255 / 0.6);
}

.text-white\/70{
  color: rgb(255 255 255 / 0.7);
}

.text-white\/75{
  color: rgb(255 255 255 / 0.75);
}

.text-white\/80{
  color: rgb(255 255 255 / 0.8);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform{
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#0A0C10;
  --surface:#12161D;
  --surface2:#171D26;
  --surface3:#1C232F;
  --border:#232B37;
  --border2:#2F3A48;
  --text:#F2F4F7;
  --muted:#9AA6B2;
  --muted2:#6B7886;
  --accent:#7CF2C0;
  --accent2:#7AB8FF;
  --amber:#FFC24B;
  --code:#0D1117;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#F6F7F8;
    --surface:#FFFFFF;
    --surface2:#F1F3F5;
    --surface3:#E9ECEF;
    --border:#DFE3E8;
    --border2:#CBD2DA;
    --text:#111418;
    --muted:#5B6773;
    --muted2:#7A8694;
    --accent:#0B7A55;
    --accent2:#2F6FD8;
    --amber:#9A6A00;
    --code:#0D1117;
  }
}

*{
  box-sizing:border-box
}

html{
  scrollbar-color:#2F3A48 transparent
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif
}

.font-mono, code, pre{
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace
}

button{
  font-family:inherit
}

pre{
  white-space:pre-wrap;
  word-break:break-word
}

::-webkit-scrollbar{
  width:10px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#2F3A48;
  border-radius:99px
}

.hover\:border-\[var\(--border2\)\]:hover{
  border-color: var(--border2);
}

.hover\:bg-\[var\(--surface2\)\]:hover{
  background-color: var(--surface2);
}

.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}

.hover\:text-\[var\(--text\)\]:hover{
  color: var(--text);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:grid{
    display: grid;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-10{
    padding-top: 2.5rem;
  }

  .sm\:text-\[15px\]{
    font-size: 15px;
  }

  .sm\:text-\[26px\]{
    font-size: 26px;
  }

  .sm\:text-\[44px\]{
    font-size: 44px;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.\[\&\>tr\]\:border-t>tr{
  border-top-width: 1px;
}

.\[\&\>tr\]\:border-\[var\(--border\)\]>tr{

DAY 1 - DOCKER BASICS ON UBUNTU VM
Purpose: Make FastAPI run inside Docker so it works anywhere.

Commands and Purpose:

  sudo apt update
  Purpose: Refresh software list from Ubuntu servers.

  sudo apt upgrade -y
  Purpose: Upgrade all packages to latest. -y means auto yes.

  sudo apt install -y ca-certificates curl gnupg
  Purpose: ca-certificates for https, curl for download, gnupg for verification.

  sudo install -m 0755 -d /etc/apt/keyrings
  Purpose: Create folder for Docker key.

  curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  Purpose: Download Docker GPG key to prove package is original.

  sudo chmod a+r /etc/apt/keyrings/docker.gpg
  Purpose: Give read permission to key.

  echo "deb [arch=...] https://download.docker.com/linux/ubuntu ..." | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
  Purpose: Add Docker repo to Ubuntu sources.

  sudo apt update
  Purpose: Refresh again including Docker repo.

  sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  Purpose: Install Docker Engine, CLI, Runtime, Build and Compose plugins.

  sudo usermod -aG docker $USER
  Purpose: Add user to docker group to run without sudo.

  newgrp docker
  Purpose: Apply group change immediately.

  docker --version
  Purpose: Check Docker installed.

  docker ps
  Purpose: List running containers.

  cd ~/rag_project
  Purpose: Go to project folder.

  ls -la
  Purpose: Verify main.py, ingest.py, query.py exist.

  pip freeze > requirements.txt
  Purpose: Save list of libraries for Docker.

  cat requirements.txt
  Purpose: Show requirements.

  nano Dockerfile
  Purpose: Create Dockerfile - recipe for image.

  Dockerfile Content Explained:
    FROM python:3.10-slim - Base Python image
    WORKDIR /app - Work folder inside container
    COPY requirements.txt . - Copy requirements
    RUN pip install --no-cache-dir -r requirements.txt - Install libs
    COPY . . - Copy all project files
    EXPOSE 8000 - Open FastAPI port
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"] - Start server

  docker build -t rag-fastapi:v1 .
  Purpose: Build image named rag-fastapi v1.

  docker images
  Purpose: Verify image created.

  docker run -d -p 8000:8000 --name rag_api rag-fastapi:v1
  Purpose: -d background, -p port map, --name container name.

  docker logs rag_api
  Purpose: Check logs for errors.

  docker ps
  Purpose: Verify container running.

  Browser: http://localhost:8000/docs
  Purpose: Swagger UI test. If opens, Day 1 DONE.

DAY 2 - DOCKER COMPOSE FULL STACK
Purpose: Run all 7 services in one command.

  Purpose: Go to project folder.

  Purpose: Create folders to save data permanently.

  nano docker-compose.yml
  Purpose: Create compose file defining all services.

    fastapi (8000) - Main API, env POSTGRES_HOST, CHROMA_HOST, OLLAMA_HOST
    postgres (5432) - User raguser, pass ragpass, db ragdb
    chroma (8001) - Vector DB, volume ./chroma_data
    ollama (11434) - LLM server, volume ollama_data

older that will hold Docker's signing key."},{c:"curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg",p:"Downloads Docker's GPG key. It proves the Docker packages you install are original, not tampered."},{c:"sudo chmod a+r /etc/apt/keyrings/docker.gpg",p:"Gives read permission to the key so apt can use it."},{c:'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null',p:"Adds Docker's official repository to Ubuntu's sources, so apt can find Docker packages."},{c:"sudo apt update",p:"Refreshes again — now including the new Docker repo."},{c:"sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin",p:"Installs Docker Engine, its CLI, the container runtime, and Build + Compose plugins."},{c:"sudo usermod -aG docker $USER",p:"Adds your user to the docker group so you can run Docker without sudo."},{c:"newgrp docker",p:"Applies the group change immediately in this shell."},{c:"docker --version",p:"Confirms Docker is installed and shows its version."},{c:"docker ps",p:"Lists running containers — empty now, but proves the daemon is up."},{c:"cd ~/rag_project",p:"Enters your project folder where main.py, ingest.py and query.py live."},{c:"ls -la",p:"Verifies main.py, ingest.py and query.py exist before you containerise them."},{c:"pip freeze > requirements.txt",p:"Saves the exact list of Python libraries, so Docker installs the same ones."},{c:"cat requirements.txt",p:"Shows that list, so you can check nothing is missing."},{c:"nano Dockerfile",p:"Opens an editor to create the Dockerfile — the recipe for your image.",file:"Dockerfile",fp:'FROM python:3.10-slim = base Python image. WORKDIR /app = work folder inside container. COPY requirements.txt . = copy requirements. RUN pip install … = install libraries. COPY . . = copy all project files. EXPOSE 8000 = open the FastAPI port. CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"] = start the server.'},{c:"docker build -t rag-fastapi:v1 .",p:"Builds an image named rag-fastapi, version v1, from the Dockerfile in this folder."},{c:"docker images",p:"Verifies the image was created."},{c:"docker run -d -p 8000:8000 --name rag_api rag-fastapi:v1",p:"Runs it in the background (-d), maps port 8000 on the VM to 8000 in the container (-p), and names it rag_api."},{c:"docker logs rag_api",p:"Checks the container logs for startup errors."},{c:"docker ps",p:"Verifies the container is running."},{c:"http://localhost:8000/docs",p:"Opens Swagger UI in the browser. If it opens, Day 1 is DONE — your API works in Docker.",file:"Browser check",fp:"Swagger = the auto-generated page where you can test your API endpoints in the browser."}]},{day:"Day 2",title:"Docker Compose — Full Stack",goal:"Run all 7 services with one command instead of starting each one separately.",items:[{c:"cd ~/rag_project",p:"Goes to the project folder."},{c:"mkdir -p chroma_data postgres_data",p:"Creates folders that hold data permanently, so history and vectors survive a restart."},{c:"nano docker-compose.yml",p:"Creates the Compose file that defines all services in one place.",file:"docker-compose.yml",fp:"Declares 7 services: fastapi (8000) — main API; postgres (5432) — raguser / ragpass / ragdb; chroma (8001) — vector DB, volume ./chroma_data; ollama (11434) — LLM server, volume ollama_data; prometheus (9090); node-exporter (9100); grafana (3000) — admin / admin123."},{c:"nano prometheus.yml",p:"Creates Prometheus config.",file:"prometheus.yml",fp:"global.scrape_interval: 15s — collect metrics every 15 seconds. Jobs: prometheus on localhost:9090, node-exporter on node-exporter:9100, fastapi on fastapi:8000."},{c:"docker compose up -d ollama",p:"Starts only Ollama first, so you can pull the model before the whole stack starts."}, a3.2:3b",p:"Downloads Llama 3.2 (3B) — the local model that will read resumes and job descriptions. Smaller than Qwen 7B, fast enough for this project."}]},{day:"Day 2",title:"parser.py — Read the Resume",goal:"Extract text from a PDF so the rest of the pipeline can use it.",items:[{c:"pip install pymupdf  # if not already installed",p:"PyMuPDF is the library that reads PDF pages."},{c:"nano parser.py",p:"Creates the parser.",file:"parser.py",fp:"Uses PyMuPDF (fitz) to open the PDF, loop through pages, and extract text. Input: Resume PDF. Output: clean text. Without this, no other step can see the resume."},{c:"python parser.py",p:"Tests the parser on a sample resume PDF and prints the extracted text."}]},{day:"Day 3",title:"ingest.py — Build the FAISS Index",goal:"Store the Job Description as searchable chunks.",items:[{c:"nano ingest.py",p:"Creates the ingestion script.",file:"ingest.py",fp:"Splits the Job Description into chunks, creates embeddings for each chunk, and stores them in FAISS. FAISS = fast similarity search — it finds which JD chunk matches a resume skill."},{c:"python ingest.py",p:"Builds the index. Run once per Job Description."}]},{day:"Day 4",title:"analyze.py — LangChain + Llama",goal:"Ask Llama to score the resume against the Job Description.",items:[{c:"nano analyze.py",p:"Creates the analysis script.",file:"analyze.py",fp:"LangChain builds the prompt and chain, FAISS supplies the relevant JD chunks, Llama 3.2 generates the match score, missing skills and interview questions."},{c:"python analyze.py",p:"Tests the analysis end-to-end and prints the score and missing skills."}]},{day:"Day 5",title:"app.py — Flask API + MongoDB",goal:"Expose the analysis as an API and store results.",items:[{c:"sudo apt update && sudo apt install -y mongodb",p:"Installs MongoDB, the document database for this project."},{c:"mongod --fork --logpath /var/log/mongod.log --dbpath /data/db",p:"Starts the MongoDB server in the background."},{c:"nano app.py",p:"Creates erfile",p:"Creates the Dockerfile for Project 2.",file:"Dockerfile",fp:"FROM python:3.10-slim → WORKDIR /app → COPY requirements.txt → RUN pip install → COPY . . → EXPOSE 5000 8501 → CMD runs the Flask + Streamlit apps."},{c:"nano docker-compose.yml",p:"Creates the Compose file.",file:"docker-compose.yml",fp:"Services: flask (5000) — API, streamlit (8501) — UI, mongo (27017) — database, mlflow (5000/5001) — tracking. Same idea as Project 1, different stack."},{c:"docker compose up -d",p:"Starts the full Project 2 stack."}]},{day:"Day 10",title:"Test the Full Flow",goal:"Prove the whole pipeline works end-to-end.",items:[{c:"Upload resume PDF + paste Job Description in Streamlit",p:"The real user action. No command needed — this is the flow you are testing."},{c:"Check: Score 78% • Missing Skills • 5 Interview Questions • PDF Report",p:"These four outputs are the definition of done for Project 2. If all four appear, the flow works."},{c:"docker logs <container>",p:"Checks logs if any service fails during the test."}]},{day:"Day 11–20",title:"Advanced + Job Ready — Summary",goal:"Extend Project 2 and turn it into a job offer, like Phase 3–4 of Project 1.",items:[{c:"Day 11–13: Add auth, error handling & history — query MongoDB for past analyses",p:"Same production lessons as Project 1: secure the API, handle bad PDFs, show past results from MongoDB."},{c:"Day 14–16: Evaluate — build a test set of 10 resumes, compare scores, tune the Llama prompt",p:"Proves the score is reliable, not random."},{c:"Day 17–18: Deploy — docker compose on EC2, add Grafana/MLflow dashboard",p:"Makes Project 2 live and visible."},{c:"Day 19–20: Resume + interview — add Project 2 to GitHub, LinkedIn and your resume; practise the 5 questions",p:"Two projects, two different stacks — that is the versatility story for HR Tech roles."}]}]}],eh=[{name:"Project 3 — Build in Order",range:"Day 1 → 15",days:[{day:"Day 1",title:"Install the Stack",goal:"Install every library for forecasting, segmentation and optimisation — one command, then the data.",items:[{c:"pip install pandas numpy scikit-learn prophet matplotlib",p:"Pandas + NumPy clean and analyse data, scikit-learn trains segmentation, Prophet forecasts sales, Matplotlib charts the trend."},{c:"pip install fastapi uvicorn psycopg2-binary sqlalchemy",p:"FastAPI + Uvicorn serve the /forecast API, SQLAlchemy and psycopg2 connect it to PostgreSQL."},{c:`python -c "import pandas, prophet; print('Stack ready')"`,p:"Verifies Pandas and Prophet import cleanly before you build on them."}]},{day:"Day 2",title:"Create data.csv + EDA with Pandas",goal:"Build the FMCG sales file and understand it before any model sees it.",items:[{c:"mkdir ~/fmcg_project && cd ~/fmcg_project",p:"Creates the FMCG project folder and enters it."},{c:"nano data.csv",p:"Creates the sales file.",file:"data.csv",fp:"Columns: Date, City, Product, Sales, Price, Distribution, Promotion. Example row: 2024-01-01,Pune,Coke,1240,20,85,1 — one day, one city, one product."},{c:'python — EDA: import pandas as pd  •  df = pd.read_csv("data.csv")  •  df.head()  •  df.describe()  •  df.groupby(["City","Product"])["Sales"].sum()',p:"Pandas loads the CSV, head() shows the first rows, describe() shows statistics, groupby() shows which city and product sell the most."},{c:'python — df.plot(x="Date", y="Sales")  # check seasonality, promotions and dips',p:"Plots sales over time so you can see festivals, promotions and weekly patterns before forecasting."}]},{day:"Day 3",title:"Feature Engineering",goal:"Turn raw sales rows into signals a forecasting model can learn from.",items:[{c:"nano features.py",p:"Creates the feature script.",file:"features.py",fp:"Date features: day, month, weekday and is_weekend. Lag features: sales 7 and 30 days ago. Rolling mean: average sales over the last 7 days. Promotion and Price stay as inputs."},{c:"python features.py",p:"Runs the feature builder and saves the enriched dataset."},{c:"df['lag_7'] = df.groupby(['City','Product'] ed for price optimisation."},{c:"nano optimize.py",p:"Creates the optimiser.",file:"optimize.py",fp:"Linear Programming: maximise Price × Expected Sales, subject to Price ≥ cost, Price ≤ market price and Sales ≥ minimum target. Solved with scipy.optimize.linprog."},{c:"python optimize.py",p:"Tests optimisation and prints the best price suggestion, e.g. Coke in Pune — ₹21 instead of ₹20."}]},{day:"Day 7",title:"FastAPI — /forecast Endpoint",goal:"Expose forecast, segment and price as one API a manager can query.",items:[{c:"nano app.py",p:"Creates the FastAPI app.",file:"app.py — GET /forecast",fp:"Endpoint /forecast?city=Pune&product=Coke: loads forecast.csv and segments.csv, returns next 30 days, the segment and the best-price suggestion as JSON."},{c:"uvicorn app:app --port 8003 --host 0.0.0.0",p:"Runs the FMCG API on port 8003."},{c:'curl "http://localhost:8003/forecast?city=Pune&product=Coke"',p:"Tests the endpoint for Coke in Pune — the example in the workflow diagram."}]},{day:"Day 8",title:"PostgreSQL — Store Forecasts",goal:"Save every forecast so Grafana, history and the UI read the same truth.",items:[{c:"sudo apt update && sudo apt install -y postgresql",p:"Installs PostgreSQL, the database for stored forecasts."},{c:`sudo -u postgres psql -c "CREATE DATABASE fmcgdb; CREATE USER fmcguser WITH PASSWORD 'fmcgpass'; GRANT ALL ON DATABASE fmcgdb TO fmcguser;"`,p:"Creates the fmcgdb database and a dedicated user for the API."},{c:"CREATE TABLE forecasts (id SERIAL PRIMARY KEY, city TEXT, product TEXT, forecast_date DATE, sales FLOAT, segment TEXT, best_price FLOAT, created_at TIMESTAMP DEFAULT NOW());",p:"Creates the table that stores each forecast date, its sales value, segment and suggested price.",file:"forecasts table",fp:"id = row number. city / product = the query. forecast_date / sales = the prediction. segment / best_price = the business outputs. created_at = when it was saved."},{c:'curl "http://localhost:8003/forecast?city=Pune&product=Coke"  # then
